# infra/docker-compose.yml
# ─────────────────────────────────────────────────────────────────────────────
# One-command local dev environment.
#
#   cp .env.example .env            # from the repo root
#   docker compose -f infra/docker-compose.yml up --build
#
# Services
#   qdrant   → http://localhost:6333   (REST API + dashboard)
#   postgres → localhost:5432
#   api      → http://localhost:8000
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Vector store ─────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST / gRPC-HTTP
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Relational database ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openuni}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openuni}
      POSTGRES_DB: ${POSTGRES_DB:-openuni}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openuni} -d ${POSTGRES_DB:-openuni}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://openuni:openuni@postgres:5432/openuni}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      UNIVERSITIES_DIR: ${UNIVERSITIES_DIR:-/app/universities}
    volumes:
      - ../universities:/app/universities:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ../apps/api/app
          target: /app/app
          ignore:
            - __pycache__/
        - action: sync
          path: ../universities
          target: /app/universities
  # ── Local Embedding Model ─────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/openuni-ollama-entrypoint"]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:0.5b}
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama/entrypoint.sh:/usr/local/bin/openuni-ollama-entrypoint:ro
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 && test -f /tmp/openuni-generation-model-ready"]
      interval: ${OLLAMA_HEALTH_INTERVAL:-10s}
      timeout: 5s
      retries: ${OLLAMA_HEALTH_RETRIES:-60}
      start_period: ${OLLAMA_HEALTH_START_PERIOD:-5m}

  # ── Web Frontend ──────────────────────────────────────────────────────────────
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: ../apps/web/src
          target: /app/src

volumes:
  qdrant_data:
  postgres_data:
  ollama_data:
